plugins
{
    id 'org.springframework.boot' version '3.5.16'
    id 'io.spring.dependency-management' version '1.1.7'
    id 'java'
    id 'eclipse'
    id 'war'
    id 'idea'
}

group = 'com.ibm.cicsdev.springboot'
version = '1.0.0'

// ============================================================================
// Java Configuration
// ============================================================================
java
{
    toolchain
    {
        languageVersion = JavaLanguageVersion.of(java_version)
    }
}

// ============================================================================
// WAR Configuration
// ============================================================================
war
{
    archiveFileName = 'cics-java-liberty-springboot-jpa.war'
}

// Two versions of the WAR would be built, one for embedding into servers like Liberty (plain)
// and a bootWAR which can run standalone and contains all the Tomcat and Spring Boot stuff
// we don't need bootWAR, so disable it.
bootWar { enabled = false }

// Eclipse: add Javadoc to classpath and pin WTP settings so Gradle Refresh doesn't reset them
eclipse
{
    classpath
    {
        downloadJavadoc = true
    }
    wtp
    {
        facet
        {
            facet name: 'jst.web', version: '6.0'
        }
        component
        {
            contextPath = 'cics-java-liberty-springboot-jpa'
        }
    }
}

repositories
{
    mavenCentral()
}

dependencies
{
    // Spring Boot web support
    implementation("org.springframework.boot:spring-boot-starter-web")

    // Don't include TomCat in the runtime build
    providedRuntime("org.springframework.boot:spring-boot-starter-tomcat")

    // Spring JPA Support
    implementation("org.springframework.boot:spring-boot-starter-data-jpa")
}
