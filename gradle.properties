# ============================================================================
# Gradle Build Properties
# ============================================================================

# Java and Encoding
java_version = 17

# CICS TS BOM version — dot-notation aligns with Maven property <cics.bom.version>
# Referenced in build.gradle as: ${project.property('cics.bom.version')}
cics.bom.version=6.1-20250812133513-PH63856

# CICS Configuration
cics.jvmserver=DFHWLP

# ============================================================================
# Gradle Performance Optimization
# ============================================================================

# Gradle daemon improves build performance
org.gradle.daemon=true

# Enable parallel builds for faster compilation
org.gradle.parallel=true

# Configuration cache disabled - CICS Bundle Plugin 1.0.8 not compatible
# org.gradle.configuration-cache=true

# Toolchain auto-provisioning - allows Gradle to download required JDK if not found locally
org.gradle.java.installations.auto-detect=true
org.gradle.java.installations.auto-download=true
